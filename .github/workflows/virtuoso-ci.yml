name: virtuoso-ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    name: Build & Test (unit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # tools 装载（musl 静态）的 target 可用性由 builder 单测把守
          targets: aarch64-unknown-linux-musl,x86_64-unknown-linux-musl

      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit Tests
        run: cargo test

  # macOS（Apple Silicon）单元回归：代码全部走 Unix 可移植 API，单测即可
  # 把守平台分支（argv 双冻结基线 / cpio newc / HostOs）。brew 依赖对应
  # verify 的 macOS host_tools 表（见 builder::verify）。
  build-test-macos:
    name: Build & Test (unit, macOS)
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-unknown-linux-musl,x86_64-unknown-linux-musl

      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit Tests
        run: cargo test

  # 内核 E2E（boot + 标记协议断言）需要内核树与 KVM/TCG 资源，
  # 放在自建 runner（openEuler 宿主，virtuoso.toml 指向内核树）上手动触发。
  # runner 前置：zig（C 测试体编译器，verify 硬闸门）、内核树、KVM。
  # runner 上以 systemd 服务或 tmux 会话常驻 virtuoso 均可。
  kernel-e2e:
    name: E2E (self-hosted, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, openeuler-kernel]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Virtuoso
        run: cargo install --path .

      - name: Virtuoso Doctor
        run: virtuoso doctor --verbose

      - name: Execute E2E Suite
        run: virtuoso test --timeout 600

      - name: Upload Run Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtuoso-runs
          path: target/runs/
