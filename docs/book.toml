# mdBook configuration (the docs site is self-contained in docs/, book root = docs/, src points at itself).
# docs/*.md is the single source of truth for documentation; this file only describes "how it is presented".
# Local build: mdbook build docs (output still lands in repo-root target/book, git-ignored);
# Online publishing: pushing main automatically builds to gh-pages (.github/workflows/docs.yml).

[book]
title = "Virtuoso — Kernel E2E Virtualization Test Harness"
authors = ["YXalix"]
description = "Kernel E2E virtualization test harness: build, launch, judge, govern, cluster across runs"
language = "en"
src = "."

[build]
build-dir = "../target/book"
create-missing = false

[output.html]
site-url = "/virtuoso/"
default-theme = "rust"
git-repository-url = "https://github.com/YXalix/virtuoso"
edit-url-template = "https://github.com/YXalix/virtuoso/edit/main/{path}"
