[package]
name = "test-bpf-ringbuf"
version = "0.1.0"
edition = "2021"
description = "programmatic eBPF pilot: aya loads a .bpf.o (BPF object built by host clang), kprobe attach + structured events flowing back over the ringbuf"

[build-dependencies]
coda-scaffold = { path = "../coda-scaffold" }

[dependencies]
coda = { path = "../coda" }

# aya is Linux-only (bpf syscall + Linux libc symbols): injected only for
# linux targets; host checks (macOS) compile an empty stub and never touch
# aya. VM builds are always the musl linux target.
[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.14.0"

# Test group: installed into /tests/bpf/, `virtuoso test --only bpf/`
# selects the whole group
[package.metadata.virtuoso]
group = "bpf"
