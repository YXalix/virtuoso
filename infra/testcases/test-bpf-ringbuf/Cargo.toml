[package]
name = "test-bpf-ringbuf"
version = "0.1.0"
edition = "2021"
description = "程序态 eBPF 试点：aya 加载 .bpf.o（宿主 clang 产 BPF 目标码），kprobe 挂接 + ringbuf 结构化事件回流"

[build-dependencies]
coda-scaffold = { path = "../coda-scaffold" }

[dependencies]
coda = { path = "../coda" }

# aya 是 Linux-only（bpf syscall + Linux libc 符号）：只对 linux 目标注入，
# 宿主 check（macOS）走空桩不碰 aya；VM 构建恒 musl linux 目标。
[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.14.0"

# 测试组：装进 /tests/bpf/，`virtuoso test --only bpf/` 整组选择
[package.metadata.virtuoso]
group = "bpf"
