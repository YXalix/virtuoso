[workspace]
resolver = "2"
# Test case directories use globs: a new test case = drop a test-<name>/
# directory in; no need to edit this file
members = ["coda", "coda-scaffold", "test-*"]

# Standalone workspace: test case firmware stays out of the virtuoso main
# workspace dependency graph (the root Cargo.toml has a matching exclude).
# Built by builder::testcase::install_rust with
# `cargo build --release --target <musl triple>`; artifacts are copied into
# the rootfs /tests/ (auto-discovered by init; crates declaring
# package.metadata.virtuoso.group are installed into a /tests/<group>/
# subdirectory = test group). Each test-* member = one test case binary;
# C test bodies live under the test case crate's c/ and are compiled into
# the same binary by its one-line build.rs (coda-scaffold);
# coda = test framework, coda-scaffold = shared build.rs scaffold.

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
# No dynamic loader inside the VM: -static is a frozen constraint. crt-static
# is rustc's default for musl targets, and rustc bundles musl libc.a +
# rust-lld (same recipe as infra/tools), so no rustflags here; the host needs
# no musl cross toolchain, just `rustup target add <triple>`.
#
# builder always builds with `--target <musl triple>` (testcase::install_rust);
# on non-Linux hosts builder injects CARGO_TARGET_<TRIPLE>_LINKER (a zig cc
# wrapper, see builder::cross, plus -C link-self-contained=no so zig supplies
# crt1/libc). The C test body compiler is injected by builder as CC_<TRIPLE>
# (the same zig cc wrapper); see the test case crate's build.rs.
