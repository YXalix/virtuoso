[package]
name = "test-example"
version = "0.1.0"
edition = "2021"
description = "example test case (Rust entry + C test body via FFI): new test cases copy this directory and adapt the TESTS list and c/ contents"

[build-dependencies]
coda-scaffold = { path = "../coda-scaffold" }

[dependencies]
coda = { path = "../coda" }

# Test group (optional): when declared, the binary is installed into
# /tests/<group>/ (name inside init = group/case, `virtuoso test --only
# <group>/` selects the whole group); default is flat in /tests/.
# [package.metadata.virtuoso]
# group = "smoke"
