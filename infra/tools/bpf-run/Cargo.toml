[package]
name = "bpf-run"
version = "0.1.0"
edition = "2021"
description = "resident in-VM eBPF runner: loads a .bpf.o, attaches per section (kprobe/kretprobe/tracepoint/raw_tracepoint), decodes ringbuf events via BTF to JSONL — the programmatic observability entry point"

[dependencies]
anyhow = "1"
serde_json = "1"
# ELF/symbol table parsing (the same pure-Rust dependency aya uses, deduped
# to one copy of the version requirement)
object = "0.39"

# aya is Linux-only (bpf syscall + Linux libc symbols): injected only for
# linux targets; host checks (macOS) build a bare stub. VM builds are always
# the musl linux target.
[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.14.0"
