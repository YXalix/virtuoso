[workspace]
resolver = "2"
members = ["agent", "bpf-run"]

# tools workspace: resident in-VM tools (std Rust + musl static). Orthogonal
# to the testcases split: tools do not go into /tests, are not auto-discovered
# by init, and take no part in marker protocol judging.
# Built with `cargo build --release --target <arch musl triple>`; artifacts
# are self-contained static ELFs (crt-static), needing no rootfs shared
# libs/dynamic loader (the VM status quo is unchanged).
# Copied into the rootfs /bin/ by builder::tools::install.

[profile.release]
lto = true
codegen-units = 1
strip = true
