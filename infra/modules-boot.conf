# Boot-critical modules for the initramfs stage.
# Loaded by infra/init-initramfs BEFORE switch_root; the only job of this
# set is to make root= (virtio ext4 disk) mountable. Keep it minimal —
# everything test-specific belongs in modules.conf, which is loaded from
# the rootfs AFTER the pivot. Dependency order matters.

# Virtio boot disk
virtio_ring
virtio
virtio_blk
virtio_pci_modern_dev
virtio_pci_legacy_dev
virtio_pci

# Root filesystem (rootfs.img, ext4 on virtio)
# crc16: ext4 dependency; builtin in some trees (mainline makes it a hidden
# tristate forced =m when ext4 is =m), module in others. The builder drops
# entries that are builtin in the target tree (modules.builtin), so listing
# it here is safe for both.
crc16
jbd2
mbcache
ext4
