[package]
# bin name = package name virtuoso (auto-detected from src/main.rs); cargo install --path . installs it into PATH.
# Single-package crate: the domain modules builder/launcher/judge/forge and the utility
# modules (arch/ui/fsutil/…) all live in src/; no workspace members.
name = "virtuoso"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
# Pure Rust backend (miniz_oxide): initrd gzip is platform-independent and introduces no C dependency
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# The test case firmware is an independent workspace (infra/testcases ships its own [workspace];
# the coda std framework + the C-bodied coda-scaffold are compiled into it), and is not part
# of this package's dependency graph.
