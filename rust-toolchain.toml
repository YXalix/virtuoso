# Pin the whole repo to stable (including the infra/testcases and infra/tools subdirectories;
# rustup resolves upward per directory). The project does not depend on nightly: the test case
# framework is std + musl static, cross-compilation wiring is injected by builder::cross, and the
# musl target is provisioned via `rustup target add <triple>` (see the comments in infra/*/.cargo/config.toml).
[toolchain]
channel = "stable"
