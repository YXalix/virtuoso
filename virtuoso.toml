# =====================================================================
# Virtuoso VM configuration — the single configuration surface
# =====================================================================
# Parsing rules:
#   * Unknown keys / invalid types error out at parse time (deny_unknown_fields);
#   * Scalar key precedence: process environment variables > this file (env
#     overrides toml for the same key, so CI/command-line tweaks don't touch
#     the file; persistent configuration lives here);
#   * Uncommented lines = the default regular launch configuration; commented
#     lines = optional items, uncomment to take effect.
#
# Componentization: each [components.*] section is one VM component, and its
# `require` declares the kernel modules (.ko) it depends on. The builder
# generates the rootfs /lib/modules/modules.conf from the union of requires
# of enabled components (init insmods them line by line after switch_root;
# a missing .ko errors at build time). require entries reuse the conf line
# format: "<module> [key=val ...]" — first token is the module name (dedup
# key), the rest are passed to insmod verbatim. Components that must load
# before root mount go in the initramfs stage get stage = "boot"; the default
# is "runtime".

# ---------------------------------------------------------------- Global

# Target architecture: x86_64 | arm64 | riscv64 (picks the QEMU binary /
# kernel image / console)
arch = "arm64"

# Test wall-clock timeout in seconds; 0 is always rejected
timeout_secs = 60

# Total vCPUs (must be divisible by node count under NUMA; checked at parse)
smp = 8

# Test mode (kernel cmdline auto_test); false = interactive boot, no auto test run
auto_test = true

# Kernel source tree (build time looks for .ko / kernel images in it).
# Default = parent directory of the project root. In docker mode this is
# overridden by the active volume: resolution order = env KERNEL_PATH > the
# current active volume written by `kernel use/clone` > this key > default.
# This key only takes effect in raw mode (no active volume).
kernel_path = "/root/kernel"

# Kernel image override (default = the arch-matching image inside the kernel tree)
# kernel_image = "/path/to/Image"

# Docker mode (containerized kernel provisioning, devkit/docker/ toolchain
# image): kernel sources live in a named volume, `virtuoso kernel
# clone/defconfig/build` work inside the tree, and the kernel tree used by
# build/test/doctor follows the active volume automatically (resolution order
# = env KERNEL_PATH > current active volume > the kernel_path key above).
# No toml key — temporary overrides go through environment variables:
#   KERNEL_VOLUME            active volume override (on top of the current
#                            state file .virtuoso/kernel-current.json)
#   KERNEL_ARCH              target arch override (default = top-level arch)
#   KERNEL_REF               default clone ref (default master)
#   KERNEL_TOOLCHAIN_IMAGE   toolchain image (default
#                            ghcr.io/yxalix/virtuoso-kernel:latest; note
#                            KERNEL_IMAGE is already taken by kernel_image
#                            and is unrelated)

# QEMU binary override (equivalent to the legacy QEMU= semantics)
# qemu = "qemu-system-aarch64"

# Kernel cmdline append segment (env CMDLINE_EXTRA overrides the same key):
# appended verbatim after the machine-assembled baseline (empty default =
# baseline unchanged). Kernel params are last-wins, so appending overrides —
# debug knobs without rebuilding this crate (console= is the exception: it
# registers a second console, and the later one becomes preferred).
# cmdline_extra = "nokaslr initcall_debug loglevel=4"

# QEMU passthrough fallback (array, passed through item by item; prefer the
# component for vfio passthrough, see below)
# qemu_opts = ["-device ivshmem-plain,memdev=hostmem"]

# ------------------------------------------------------------- VM components

[components.tools_disk]
# tools.img resident tool disk: attached as virtio-blk → mounted at /tools
# from /dev/vdb inside the guest, tool directory injected into PATH. Section
# default (whole section commented) = enabled; skipped automatically when
# tools.img has not been built.
enabled = true
# require = ["virtio_blk", "ext4"]   # already in the boot base set; declared for documentation only

# [components.agent]
# AI probe channel: virtio-serial port + in-guest virtuoso-agent (virtuoso
# probe always uses this channel, independent of this switch). When enabled,
# shell/test also attach the channel, and virtio_console.ko goes into the
# rootfs with this component. Section default = off (argv stays at the frozen
# baseline).
# enabled = true
# require = ["virtio_console"]

# [components.vfio]
# vfio-pci passthrough: devices generates one -device vfio-pci,host=<bdf> each.
# Linux hosts only (needs KVM + IOMMU); enabling on macOS is rejected by
# doctor/verify.
# enabled = true
# devices = ["0000:01:00.0"]
# require = ["vfio", "vfio_pci"]     # guest-side drivers, choose per kernel-under-test config
# stage = "boot"                     # change to boot only when early-boot availability is needed

# [components.numa]
# Multi-node NUMA topology (default single node, no -numa args). Total memory
# = memory_per_node × nodes; smp must be divisible by nodes.
# enabled = true
# nodes = 2
# memory_per_node = "1G"

# [components.pmem]
# Persistent memory (DT route, arm64/riscv64): a pmem-region node is injected
# into the device tree (the cli generates a patched DTB via dumpdtb+fdtput,
# passed in with -dtb), the cmdline appends mem=<total−size> to exclude the
# pmem region from kernel linear memory (equivalent to x86 memmap= semantics),
# and the main memory backend switches to a host file (share=on) — the pmem
# region is file-backed, so guest writes persist to disk. In-guest of_pmem
# registers /dev/pmem0 without ndctl (DAX=1; mkfs then mount -o dax gives
# fsdax). size = pmem region size (default "256M", 2MiB aligned, must be
# smaller than total memory); section default = off (argv stays at the frozen
# baseline). Note: QEMU nvdimm's ACPI NFIT is not visible under arm64 direct
# boot (needs EFI boot); the x86_64 route is supported separately.
# enabled = true
# size = "256M"
# require = ["libnvdimm", "nd_btt", "of_pmem", "nd_pmem"]  # declare when kernel has =m (includes load order)
# stage = "runtime"                              # loaded at the rootfs stage (default)

# [components.bpf]
# bpf observability component: bpftrace (official Release AppImage, self-
# contained Nix closure) is provisioned with the tools disk and runs directly
# at /tools/bin/bpftrace (PATH already injected). Unpacking happens inside
# the container at build time (needs docker, same dependency as kernel
# provisioning); zero unpacking inside the VM. Kernel side requires BPF/BTF
# (on by default in the openEuler defconfig). Enabling grows tools.img to
# ~600M; the first build downloads ~190M and unpacks, afterwards the cache is
# reused. Section default = off.
# Note bpftool / bpf-run are unrelated to this switch and always resident in
# /bin: bpftool is built statically from the kernel tree by `virtuoso kernel
# build` (links the in-tree libbpf); this switch only gates bpftrace.
# enabled = true

# ------------------------------------------------------------- Test cases

# [tests]
# Kernel module dependencies of the test suite: when writing test cases for a
# kernel feature, the natural home for the modules under test (prefer =m to
# avoid kernel rebuilds) — no need to hang them on unrelated components.
# Entry format matches component require ("<module> [key=val ...]", first
# token is the module name/dedup key, the rest passed to insmod verbatim),
# always runtime stage (test cases run after pivot); component entries for
# the same module win, this only supplies the difference.
# require = ["overlay", "kvm"]

# ------------------------------------------------------------- Supply chain

# [busybox]
# Static busybox is provisioned uniformly from a GitHub Release (see
# .github/workflows/busybox-release.yml): downloads hit the cache under
# target/build for reuse, no local source builds, and an all-miss (repo not
# configured / offline) errors out directly.
# version = "1.36.1"
# release_repo = "owner/repo"        # repo publishing busybox-v* (owner/repo; default scans git remotes)
# dl_url = "https://example.com/busybox"   # or give the asset URL directly
